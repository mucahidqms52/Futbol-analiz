name: Mutating Veri Toplayıcı

on:
  # Her 2 saatte bir çalıştır (00:00, 02:00, 04:00...)
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: 📥 Repoyu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper-requirements.txt

      - name: 🎭 Playwright kur
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 🤖 Botu çalıştır
        run: python scraper.py
        timeout-minutes: 40

      - name: 💾 Değişiklikleri commit et
        run: |
          git config user.name "Mutating Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Otomatik: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
