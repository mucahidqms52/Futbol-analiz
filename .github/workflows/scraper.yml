name: Mutaring Otomasyon

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir otomatik çalışır
  workflow_dispatch: # Telefondan dilediğin zaman elle de çalıştırabilirsin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install -r requirements.txt

      - name: Botu Çalıştır
        run: python otomatik_bot.py

      - name: Güncellenen JSON Dosyalarini Kaydet ve Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gelecek.json gecmis.json
          git diff --staged --quiet || git commit -m "Otomatik maç verileri güncellendi [skip ci]"
          git push
